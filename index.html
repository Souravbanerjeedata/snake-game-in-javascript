<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <meta name="description" content="A visually stunning Snake game with smooth animations, contrast fading, and hard mode." />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Neon Snake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <div class="container">
      <h1 class="title">NEON<span>SNAKE</span></h1>

      <header>
        <div class="stat contrast-box">
          <span class="stat-label">CONTRAST</span>
          <span class="contrast">100%</span>
        </div>
        <div class="stat score-box">
          <span class="stat-label">SCORE</span>
          <span class="score">0</span>
        </div>
      </header>

      <div class="grid-wrapper">
        <div class="grid"></div>
      </div>

      <!-- Mobile Controls -->
      <div class="mobile-controls">
        <div class="dpad">
          <button class="ctrl-btn up" data-dir="up" aria-label="Up">▲</button>
          <div class="dpad-middle">
            <button class="ctrl-btn left" data-dir="left" aria-label="Left">◀</button>
            <button class="ctrl-btn right" data-dir="right" aria-label="Right">▶</button>
          </div>
          <button class="ctrl-btn down" data-dir="down" aria-label="Down">▼</button>
        </div>

        <div class="action-buttons">
          <button class="action-btn restart-btn" id="restartBtn">RESTART</button>
          <button class="action-btn mode-btn" id="modeBtn">HARD</button>
        </div>
      </div>

      <footer>
        <div class="footer-main">Swipe or use buttons to play</div>
        <div class="footer-sub desktop-only">Arrow keys • SPACE to restart • H / E for mode</div>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
