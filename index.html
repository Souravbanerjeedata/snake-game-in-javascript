<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <meta
      name="description"
      content="A visually stunning Snake game with smooth animations, contrast fading, and hard mode."
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Neon Snake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <div class="container">
      <h1 class="title">NEON<span>SNAKE</span></h1>

      <header>
        <div class="stat contrast-box">
          <span class="stat-label">CONTRAST</span>
          <span class="contrast">100%</span>
        </div>
        <div class="stat score-box">
          <span class="stat-label">SCORE</span>
          <span class="score">0</span>
        </div>
      </header>

      <div class="grid-wrapper">
        <div class="grid"></div>
      </div>

      <footer>
        <div class="footer-sub desktop-only">
          Arrow keys • SPACE to restart • H / E for mode
        </div>
      </footer>
    </div>

    <!-- Mode Selection Modal (mobile) -->
    <div class="modal" id="modeModal">
      <div class="modal-content">
        <h2 class="modal-title">NEON<span>SNAKE</span></h2>
        <p class="modal-text">Choose your mode</p>
        <div class="modal-buttons">
          <button class="modal-btn easy-btn" id="easyBtn">EASY</button>
          <button class="modal-btn hard-btn" id="hardBtn">HARD</button>
        </div>
        <p class="modal-hint">Swipe to control the snake</p>
      </div>
    </div>

    <!-- Game Over Modal (mobile) -->
    <div class="modal hidden" id="gameOverModal">
      <div class="modal-content">
        <h2 class="modal-title game-over-title">GAME OVER</h2>
        <p class="modal-score" id="finalScore">Score: 0</p>
        <p class="modal-message" id="gameOverMsg">The snake hit the wall</p>
        <div class="modal-buttons">
          <button class="modal-btn restart-modal-btn" id="restartModalBtn">
            PLAY AGAIN
          </button>
        </div>
      </div>
    </div>

    <script src="script.js"></script>
  </body>
</html>
