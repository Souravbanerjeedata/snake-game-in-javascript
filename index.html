<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="A visually stunning Snake game with smooth animations, contrast fading, and hard mode." />
    <title>Neon Snake</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="bg-grid"></div>
    <div class="glow-orb glow-orb-1"></div>
    <div class="glow-orb glow-orb-2"></div>

    <div class="container">
      <h1 class="title">NEON<span>SNAKE</span></h1>

      <header>
        <div class="stat contrast-box">
          <span class="stat-label">CONTRAST</span>
          <span class="contrast">100%</span>
        </div>
        <div class="stat score-box">
          <span class="stat-label">SCORE</span>
          <span class="score">0</span>
        </div>
      </header>

      <div class="grid-wrapper">
        <div class="grid"></div>
      </div>

      <footer>
        <div class="footer-main">Press an arrow key or SPACE to start</div>
        <div class="footer-sub">Ready for hard mode? Press <kbd>H</kbd></div>
      </footer>
    </div>

    <script src="script.js"></script>
  </body>
</html>
